<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chatLogo.png" />
    <!-- no pinch zoom, draw under the notch / status bar, and shrink the page when the keyboard opens -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0F0B14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Great+Vibes&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Chatzy</title>
  </head>
  <body>
    <div id="root"><div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0F0B14;color:#FFB36B;font:700 2.4rem Fredoka,system-ui,sans-serif"><img src="/icon.png" width="84" height="84" alt="" style="border-radius:22px;animation:pl 1.2s ease-in-out infinite">Chatzy</div></div>
    <style>@keyframes pl{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}</style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
